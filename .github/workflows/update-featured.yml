name: Refresh profile README

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-featured.yml"
      - ".github/scripts/**"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refresh Featured, Stack and streak cards
        uses: actions/github-script@v8
        with:
          script: |
            const refresh = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/refresh-profile.js`);
            await refresh({ github, context, core });

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain README.md assets)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git commit -m "chore: refresh profile README"
          git pull --rebase
          git push
