name: Update featured repositories

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-featured.yml"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { data } = await github.rest.repos.listForUser({
              username: context.repo.owner,
              sort: "updated",
              direction: "desc",
              per_page: 100,
            });

            const repositories = data
              .filter(repo => !repo.fork && repo.name !== context.repo.repo)
              .sort((a, b) => b.stargazers_count - a.stargazers_count || new Date(b.updated_at) - new Date(a.updated_at))
              .slice(0, 4);

            const safe = value => (value || "A project by sepivip").replace(/[|\r\n]/g, " ").trim();
            const rows = repositories.map(repo =>
              `| ![Stars](https://img.shields.io/github/stars/${repo.full_name}?style=flat-square&label=⭐) | **[${repo.name}](${repo.html_url})** | ${safe(repo.description)} |`
            );
            const table = [
              "<!-- featured:start -->",
              "| | Repo | Description |",
              "|---|---|---|",
              ...rows,
              "<!-- featured:end -->",
            ].join("\n");

            const path = "README.md";
            const readme = fs.readFileSync(path, "utf8");
            const updated = readme.replace(/<!-- featured:start -->[\s\S]*?<!-- featured:end -->/, table);
            if (updated === readme) core.setFailed("Featured markers were not found in README.md.");
            else fs.writeFileSync(path, updated);
      - name: Commit refreshed featured projects
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh featured repositories"
          git push
